<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" width="100%" height="100%">
  <defs>
    <linearGradient id="bookGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="50%" stop-color="#172554" />
      <stop offset="100%" stop-color="#091226" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>
  <rect width="400" height="560" rx="16" fill="url(#bookGrad)" />
  <!-- Spine decoration -->
  <rect x="0" y="0" width="30" height="560" fill="rgba(255,255,255,0.06)" />
  <line x1="30" y1="0" x2="30" y2="560" stroke="rgba(255,255,255,0.12)" stroke-width="2" />
  
  <!-- Decorative Frame -->
  <rect x="50" y="40" width="310" height="480" rx="10" fill="none" stroke="rgba(251,191,36,0.3)" stroke-width="2" stroke-dasharray="6,4" />
  
  <!-- Icon -->
  <g transform="translate(160, 150)">
    <circle cx="40" cy="40" r="48" fill="rgba(251,191,36,0.15)" />
    <path d="M22 26 L40 18 L58 26 L58 54 L40 46 L22 54 Z" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M40 18 L40 46" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" />
  </g>
  
  <!-- Title text -->
  <text x="200" y="280" font-family="'Be Vietnam Pro', 'Segoe UI', sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">THƯ VIỆN HUFLIT</text>
  <text x="200" y="315" font-family="'Be Vietnam Pro', 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="url(#goldGrad)" text-anchor="middle">GIÁO TRÌNH HỌC THUẬT</text>
  
  <!-- Divider -->
  <line x1="120" y1="340" x2="280" y2="340" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" />
  
  <!-- Bottom info -->
  <text x="200" y="380" font-family="'Be Vietnam Pro', 'Segoe UI', sans-serif" font-size="12" fill="#93c5fd" text-anchor="middle">Kho Tài Liệu &amp; Tri Thức Số</text>
  <text x="200" y="460" font-family="monospace" font-size="11" fill="rgba(255,255,255,0.4)" text-anchor="middle">SMARTLIB SYSTEM</text>
</svg>
